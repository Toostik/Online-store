spring.application.name=AuthService

server.port=8081
#Key
app.private.key.path=classpath:keys/private_pkcs8.pem
app.public.key.path=classpath:keys/public.pem

#Jwt
app.jwt.access-expiration=864000
app.jwt.refresh-expiration=604800000
#DB
spring.datasource.url=jdbc:postgresql://postgres:5432/shop_db
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update


#Kafka
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=users-consumers-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.ack-mode=manual

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=\
com.example.userservice.dto.UserDto:com.example.authservice.dto.UserDto

spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Redis

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.jedis.pool.max-idle=8

logging.level.org.springframework.cache=TRACE
