spring.application.name=ProductService

server.port=8083

spring.datasource.url=jdbc:postgresql://postgres:5432/shop_db
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.properties.hibernate.default_schema=product_service
spring.jpa.hibernate.ddl-auto=update

app.public.key.path=classpath:public.pem

#Log
logging.level.org.springframework.security=DEBUG

#Kafka
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=product-consumers-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.ack-mode=manual

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#Redis

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.jedis.pool.max-idle=8

logging.level.org.springframework.cache=TRACE

#ElasticSearch

spring.elasticsearch.uris=http://elasticsearch:9200

#Prometheus
management.endpoints.web.exposure.include=prometheus,health,info

management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

#MiniO
minio.url = http://minio:9000
minio.access-key=admin
minio.secret-key=password123
minio.bucket=products
