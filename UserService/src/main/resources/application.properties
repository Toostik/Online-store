spring.application.name=UserService

server.port=8082

spring.datasource.url=jdbc:postgresql://postgres:5432/shop_db
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.properties.hibernate.default_schema=user_service
spring.jpa.hibernate.ddl-auto=update

app.public.key.path=classpath:public.pem

logging.level.org.springframework.security= DEBUG

#Kafka

# Kafka consumer
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=order-consumers-group
spring.kafka.consumer.auto-offset-reset=latest

# Manual ack
spring.kafka.listener.ack-mode=manual

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Redis

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.jedis.pool.max-idle=8

logging.level.org.springframework.cache=TRACE

#Prometheus
management.endpoints.web.exposure.include=prometheus,health,info

management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

#MiniO
minio.url = http://minio:9000
minio.access-key=admin
minio.secret-key=password123
minio.bucket=avatars


