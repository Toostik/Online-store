spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/${segment}

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**, /uploads
          filters:
            - RewritePath=/api/users/(?<segment>.*), /api/users/${segment}

        - id: product-service
          uri: http://product-service:8083
          predicates:
            - Path=/api/products/**, /api/categories/**

        - id: cart-service
          uri: http://cart-service:8084
          predicates:
            - Path=/api/carts/**

        - id: order-service
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**

      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://127.0.0.1:5500"
                  - "http://localhost:5500"
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_db
    username: user
    password: password

  data:
    redis:
      host: redis
      port: 6379
      password: ""
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

  tracing:
    sampling:
      probability: 1.0   # 100% запросов

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

app:
  public:
    key:
      path: classpath:keys/public.pem