# ============================================================
#  docker-compose.dev.yml  —  ЛОКАЛЬНАЯ РАЗРАБОТКА
#
#  Запуск:  docker compose -f docker-compose.dev.yml up -d
#
#  Особенности:
#  - Все инфраструктурные порты доступны на localhost
#    (для подключения IDE, DBeaver, Redis Insight и т.д.)
#  - Java-сервисы запускаются через mvn spring-boot:run
#    (медленный старт, зато не нужно собирать jar)
#  - Секреты хранятся в .env файле (см. .env.dev.example)
#  - Нет resource limits — пусть IDE дышит свободно
#  - restart: "no" — не нужен авторестарт при разработке
# ============================================================

networks:
  shop-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:

  # ==================== ИНФРАСТРУКТУРА ====================

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: "no"
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d shop_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shop-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: "no"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - shop-net

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - shop-net

  # ==================== KAFKA ====================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: "no"
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shop-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: "no"
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - shop-net

  # Debezium Connect — CDC для Outbox pattern
  connect:
    image: debezium/connect:2.5
    container_name: debezium-connect
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8088:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/connectors" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - shop-net

  # ==================== МИКРОСЕРВИСЫ (DEV) ====================
  # Используют maven:3.9.9-eclipse-temurin-21 + mvn spring-boot:run
  # Медленный старт (~60-90 сек на сервис), зато не нужен jar
  #
  # Windows-пути к ключам (D:/Projects/keys) и Maven кешу
  # (C:/Users/Роман/.m2) оставлены как у вас.
  # На Linux/Mac замените на свои пути или используйте переменные:
  #   KEYS_PATH и M2_CACHE в .env файле
  # ============================================================

  api-gateway:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: api-gateway
    restart: "no"
    working_dir: /workspace/ApiGateway
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  auth-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: auth-service
    restart: "no"
    working_dir: /workspace/AuthService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_PRIVATE_KEY: /keys/private_pkcs8.pem
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  user-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: user-service
    restart: "no"
    working_dir: /workspace/UserService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  product-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: product-service
    restart: "no"
    working_dir: /workspace/ProductService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - shop-net

  cart-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cart-service
    restart: "no"
    working_dir: /workspace/CartService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  order-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: order-service
    restart: "no"
    working_dir: /workspace/OrderService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  payment-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: payment-service
    restart: "no"
    working_dir: /workspace/PaymentService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-net

  notification-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: notification-service
    restart: "no"
    working_dir: /workspace/NotificationService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - ${KEYS_PATH:-D:/Projects/OnlineShop/keys}:/keys:ro
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      JWT_PUBLIC_KEY: /keys/public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shop-net

  order-orchestration-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: order-orchestration-service
    restart: "no"
    working_dir: /workspace/OrderOrchestratorService
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Xms128m -Xmx256m"
    volumes:
      - .:/workspace
      - ${M2_CACHE:-C:/Users/Роман/.m2}:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev    
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shop-net

  # ==================== МОНИТОРИНГ ====================
  # В dev: порты доступны на localhost для просмотра дашбордов

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "no"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - shop-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - shop-net

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: "no"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - shop-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: "no"
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    networks:
      - shop-net
