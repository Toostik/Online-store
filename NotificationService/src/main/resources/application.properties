spring.application.name=NotificationService

server.port=8087

spring.datasource.url=jdbc:postgresql://postgres:5432/shop_db
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.properties.hibernate.default_schema=notification_service
spring.jpa.hibernate.ddl-auto=update

app.public.key.path=classpath:public.pem

#Kafka
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=product-consumers-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.ack-mode=manual

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#Prometheus
management.endpoints.web.exposure.include=prometheus,health,info

management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

