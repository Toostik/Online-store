name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  OrderService:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build order-service
        run: cd order-service && mvn clean compile

      - name: Test order-service
        run: cd order-service && mvn test
