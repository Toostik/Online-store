services:
  # ====================== ИНФРАСТРУКТУРА ======================

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  minio:
    image: quay.io/minio/minio
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

  connect:
    image: debezium/connect:2.5
    ports:
      - "8088:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
  # ====================== KAFKA ======================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ====================== МИКРОСЕРВИСЫ (DEV) ======================

  api-gateway:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: api-gateway
    working_dir: /workspace/ApiGateway
    command: mvn spring-boot:run
    volumes:
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    ports:
      - "8080:8080"

  auth-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: auth-service
    working_dir: /workspace/AuthService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PRIVATE_KEY: /keys/private_pkcs8.pem
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  user-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: user-service
    working_dir: /workspace/UserService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  product-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: product-service
    working_dir: /workspace/ProductService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8083:8080"

  cart-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cart-service
    working_dir: /workspace/CartService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8084:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  order-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: order-service
    working_dir: /workspace/OrderService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8085:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  payment-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: payment-service
    working_dir: /workspace/PaymentService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8086:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  notification-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: notification-service
    working_dir: /workspace/NotificationService
    command: mvn spring-boot:run
    volumes:
      - D:/Projects/keys:/keys:ro
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    environment:
      JWT_PUBLIC_KEY: /keys/public.pem
    ports:
      - "8087:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  order-orchestration-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: order-orchestration-service
    working_dir: /workspace/OrderOrchestratorService
    command: mvn spring-boot:run
    volumes:
      - .:/workspace
      - C:/Users/Роман/.m2:/root/.m2
    ports:
      - "8089:8080"
    depends_on:
      - postgres
      - kafka

  # ====================== MONITORING ======================

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  minio_data:
